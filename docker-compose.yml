version: '3.8'

services:
  backend:
    build: ./neurofeedback-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/neurofeedback.db
      - JWT_SECRET=neurofeedback-secret-key-change-me
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build: ./neurofeedback-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: always
